<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Abdias: O Construtor Imparável</title>
<style>
:root{--cream:#fff2cf;--ink:#241b31;--orange:#f58a24;--blue:#75c9dd;--green:#70a852}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171529;font-family:Trebuchet MS,system-ui,sans-serif;color:var(--cream)}
button{font:700 14px Trebuchet MS,system-ui;border:0;cursor:pointer}#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto}.panel{position:absolute;inset:0;background:linear-gradient(135deg,#253a55 0%,#17263d 58%,#151329 100%);display:flex;align-items:center;justify-content:center;text-align:center}.hidden{display:none!important}
.logo{position:relative;margin-bottom:18px}.logo .eyebrow{letter-spacing:5px;font-size:12px;color:#ffca78}.logo h1{font-size:clamp(38px,7vw,78px);line-height:.86;margin:8px 0;text-shadow:0 7px 0 #10233a}.logo h1 span{display:block;color:#ffad3b}.logo p{color:#bfe7df;letter-spacing:2px}.menu-actions{display:flex;flex-direction:column;gap:10px;width:min(300px,75vw);margin:auto}.primary{background:#f69a32;color:#25182b;border-radius:14px;padding:15px;box-shadow:0 6px 0 #b95a22}.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #b95a22}.secondary{background:#fff1c7;color:#33243b;border-radius:14px;padding:12px}.hero-art{position:absolute;right:7%;bottom:4%;width:28%;height:70%;opacity:.22;border-radius:50% 50% 10% 10%;background:radial-gradient(circle at 50% 18%,#7bc0d7 0 3%,transparent 4%),linear-gradient(135deg,#f3a340,#bf652d)}
.hud{position:absolute;left:16px;right:16px;top:12px;display:flex;justify-content:space-between;pointer-events:none}.hud-box{background:rgba(20,24,43,.78);border:2px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;text-shadow:0 2px #111}.objective{max-width:min(480px,55vw)}#materials{display:flex;gap:8px}.mat{font-size:12px}.bottom-hud{position:absolute;left:14px;bottom:12px;display:flex;gap:8px}.build-btn{pointer-events:auto;width:48px;height:48px;border-radius:50%;background:#fff1c4;color:#39283e;border:3px solid #ef9a3a;box-shadow:0 4px #b95a22}.level-banner{position:absolute;top:18%;left:50%;transform:translateX(-50%);background:rgba(25,27,47,.9);border:1px solid #ffc36b;border-radius:16px;padding:12px 22px;text-align:center;animation:fade 5s forwards}@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}
.dialogue{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);width:min(680px,calc(100% - 28px));background:rgba(20,22,42,.94);border:2px solid #f4b85e;border-radius:14px;padding:14px 18px;min-height:82px}.dialogue strong{color:#ffd28b}.dialogue button{float:right;margin:6px 0 0 12px;background:#f69a32;color:#25182b;border-radius:8px;padding:8px 12px}
#buildMenu{position:absolute;right:14px;bottom:74px;width:min(270px,46vw);background:rgba(18,21,38,.96);border:2px solid #79b8c8;border-radius:14px;padding:10px}.build-card{display:flex;justify-content:space-between;align-items:center;width:100%;margin:5px 0;padding:9px;border-radius:8px;background:#302c49;color:#fff}.build-card small{color:#ffcf85}.build-card.off{opacity:.45}
#touch{display:none}.touch-btn{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(255,245,209,.22);border:2px solid rgba(255,245,209,.55);color:white;font-size:20px}.left{left:18px;bottom:30px}.right{left:88px;bottom:30px}.jump{right:18px;bottom:30px}.use{right:88px;bottom:100px;font-size:12px}.build-touch{right:18px;bottom:100px;font-size:11px}
#pause,#map,#victory{position:absolute;inset:0;background:rgba(12,14,30,.88);z-index:20}.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 30px));background:#282842;border:2px solid #e9ad63;border-radius:18px;padding:22px;text-align:center}.level-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.level-grid button{height:54px;border-radius:9px;background:#45445d;color:white}.level-grid button.done{background:#71a66d}.level-grid button.lock{background:#25263a;color:#77798d}
@media(pointer:coarse){#touch.game-active{display:block}.bottom-hud{display:none}.dialogue{bottom:170px}}
@media(orientation:portrait){#rotateNotice{display:flex}}@media(aspect-ratio:16/9),@media(min-aspect-ratio:16/10){#app{aspect-ratio:16/9;max-width:100vw;max-height:100vh;margin:auto}}#rotateNotice{display:none;position:absolute;z-index:100;inset:0;background:#171529;align-items:center;justify-content:center;text-align:center;padding:30px}.rotate-phone{width:86px;height:86px;border:3px solid #f69a32;border-radius:18px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:42px;animation:turn 1.8s ease-in-out infinite}@keyframes turn{50%{transform:rotate(90deg)}}
</style>
</head>
<body><div id="app">
<div id="rotateNotice"><div><div class="rotate-phone">▭</div><h2>Gire o dispositivo</h2><p>Abdias foi feito para ser jogado na horizontal.</p></div></div>
<canvas id="game"></canvas>
<div id="mainMenu" class="panel"><div class="hero-art"></div><div><div class="logo"><div class="eyebrow">UMA AVENTURA SOBRE CRIAR</div><h1>ABDIAS <span>O CONSTRUTOR IMPARÁVEL</span></h1><p>Construa. Supere. Impossível não é opção.</p></div><div class="menu-actions"><button class="primary" id="start">INICIAR CAMPANHA</button><button class="secondary" id="levels">SELEÇÃO DE FASES</button></div></div></div>
<div id="hud" class="hud hidden"><div class="hud-box objective"><b id="levelName">Fase</b><br><span id="objective">Objetivo</span></div><div id="materials" class="hud-box"></div></div><div id="bottomHud" class="bottom-hud hidden"><button class="build-btn" id="buildBtn">🔨</button></div>
<div id="banner" class="level-banner hidden"></div><div id="dialogue" class="dialogue hidden"><span id="dialogueText"></span><button id="nextDialog">Continuar</button></div>
<div id="buildMenu" class="hidden"></div>
<div id="touch"><button class="touch-btn left" data-key="left">◀</button><button class="touch-btn right" data-key="right">▶</button><button class="touch-btn jump" data-key="jump">▲</button><button class="touch-btn use" data-key="use">AÇÃO</button><button class="touch-btn build-touch" data-key="build">CONSTR.</button></div>
<div id="pause" class="hidden"><div class="modal"><h2>Pausa</h2><div class="menu-actions"><button class="primary" id="resume">Continuar</button><button class="secondary" id="restart">Reiniciar fase</button><button class="secondary" id="menu">Menu principal</button></div></div></div>
<div id="map" class="hidden"><div class="modal"><h2>Seleção de fases</h2><div class="level-grid" id="levelGrid"></div><br><button class="secondary" id="closeMap">Voltar</button></div></div>
<div id="victory" class="hidden"><div class="modal" id="victoryBox"></div></div>
</div>
<script src="game.js"></script>
</body></html>
